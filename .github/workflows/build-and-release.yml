name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.1

# Grant write access so the action can create GitHub Releases
permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Caches downloaded Android SDKs and Gradle dependencies

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches the Flutter SDK itself

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: EzeeWash ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
