name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: EzeeWash ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: gh auth status

      - name: Download APK from Private Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets

          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Mirror Release to Public Repository
        id: mirror
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="Abdulaowalasif/ezze-wash-apk-release"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" public-repo

          cd public-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          cd ..

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release exists. Uploading APK..."

            gh release upload \
              "${TAG}" \
              release-assets/* \
              --repo "${REPO}" \
              --clobber
          else
            echo "Creating release..."

            gh release create \
              "${TAG}" \
              release-assets/* \
              --repo "${REPO}" \
              --title "EzeeWash ${TAG}" \
              --generate-notes
          fi

      # ─────────────────────────────────────────────
      # Cleanup Private Repository
      # Keep APK only on the current/latest release
      # ─────────────────────────────────────────────

      - name: Cleanup Old APK Assets in Private Repo (keep latest)
        if: success() && steps.mirror.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          CURRENT_TAG="${{ github.ref_name }}"

          echo "Keeping APK asset only on: $CURRENT_TAG"
          echo "Repository: $REPO"

          gh release list \
            --repo "$REPO" \
            --limit 100 \
            --json tagName \
            -q '.[].tagName' |
          while read -r TAG; do

            if [ "$TAG" != "$CURRENT_TAG" ]; then

              ASSETS=$(gh release view "$TAG" \
                --repo "$REPO" \
                --json assets \
                -q '.assets[].name' |
                grep -i '\.apk$' || true)

              for ASSET in $ASSETS; do
                echo "Removing APK asset '$ASSET' from release $TAG"

                gh release delete-asset \
                  "$TAG" \
                  "$ASSET" \
                  --repo "$REPO" \
                  --yes
              done

            fi

          done

          echo "Private repository cleanup completed."

      # ─────────────────────────────────────────────
      # Cleanup Public Repository
      #
      # Keep APK on:
      #   1. Current release
      #   2. Previous release
      #   3. Previous-previous release
      #
      # Delete APK from anything older.
      # ─────────────────────────────────────────────

      - name: Cleanup Old APK Assets in Public Repo (keep latest 3)
        if: success() && steps.mirror.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          REPO="Abdulaowalasif/ezze-wash-apk-release"
          CURRENT_TAG="${{ github.ref_name }}"
          KEEP_PREVIOUS=2

          echo "=========================================="
          echo "Public Repository APK Cleanup"
          echo "=========================================="
          echo "Repository: $REPO"
          echo "Current release: $CURRENT_TAG"
          echo "Current APK will NEVER be deleted."
          echo "Keeping current + $KEEP_PREVIOUS previous releases."
          echo "=========================================="

          # Get all releases except the current release.
          #
          # Sort by createdAt:
          # newest -> oldest
          #
          # The current release is explicitly excluded so it
          # can NEVER be selected for deletion.

          gh release list \
            --repo "$REPO" \
            --limit 100 \
            --json tagName,createdAt \
            -q "map(select(.tagName != \"$CURRENT_TAG\")) | sort_by(.createdAt) | reverse | .[].tagName" \
            > previous_tags.txt

          echo ""
          echo "Previous releases:"
          cat previous_tags.txt || true

          echo ""
          echo "=========================================="
          echo "Releases whose APK will be kept:"
          echo "=========================================="

          head -n "$KEEP_PREVIOUS" previous_tags.txt || true

          echo ""
          echo "=========================================="
          echo "Cleaning old APK assets..."
          echo "=========================================="

          # Skip the newest 2 previous releases.
          # Everything after them is old.

          tail -n +$((KEEP_PREVIOUS + 1)) previous_tags.txt |
          while read -r TAG; do

            [ -z "$TAG" ] && continue

            echo ""
            echo "Cleaning old release: $TAG"

            ASSETS=$(gh release view "$TAG" \
              --repo "$REPO" \
              --json assets \
              -q '.assets[].name' |
              grep -i '\.apk$' || true)

            if [ -z "$ASSETS" ]; then
              echo "No APK assets found in $TAG"
              continue
            fi

            for ASSET in $ASSETS; do

              echo "Removing APK asset '$ASSET' from release $TAG"

              gh release delete-asset \
                "$TAG" \
                "$ASSET" \
                --repo "$REPO" \
                --yes

            done

          done

          echo ""
          echo "=========================================="
          echo "Public repository cleanup completed."
          echo "=========================================="
          echo ""
          echo "APK assets remain on:"

          echo "Current:"
          echo "$CURRENT_TAG"

          echo ""
          echo "Previous releases:"
          head -n "$KEEP_PREVIOUS" previous_tags.txt || true