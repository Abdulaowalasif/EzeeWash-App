name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: EzeeWash ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: gh auth status

      - name: Download APK from Private Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets

          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Mirror Release to Public Repository
        id: mirror
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="Abdulaowalasif/ezze-wash-apk-release"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" public-repo

          cd public-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          cd ..

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release exists. Uploading APK..."

            gh release upload \
              "${TAG}" \
              release-assets/* \
              --repo "${REPO}" \
              --clobber
          else
            echo "Creating release..."

            gh release create \
              "${TAG}" \
              release-assets/* \
              --repo "${REPO}" \
              --title "EzeeWash ${TAG}" \
              --generate-notes
          fi

      # ─────────────────────────────────────────────
      # Cleanup Private Repository
      # Keep APK only on the current/latest release
      # ─────────────────────────────────────────────

      - name: Cleanup Old APK Assets in Private Repo (keep latest)
        if: success() && steps.mirror.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          CURRENT_TAG="${{ github.ref_name }}"

          echo "Keeping APK asset only on: $CURRENT_TAG"
          echo "Repository: $REPO"

          gh release list \
            --repo "$REPO" \
            --limit 100 \
            --json tagName \
            -q '.[].tagName' |
          while read -r TAG; do

            if [ "$TAG" != "$CURRENT_TAG" ]; then

              ASSETS=$(gh release view "$TAG" \
                --repo "$REPO" \
                --json assets \
                -q '.assets[].name' |
                grep -i '\.apk$' || true)

              for ASSET in $ASSETS; do
                echo "Removing APK asset '$ASSET' from release $TAG"

                gh release delete-asset \
                  "$TAG" \
                  "$ASSET" \
                  --repo "$REPO" \
                  --yes
              done

            fi

          done

          echo "Private repository cleanup completed."