name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.1

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: EzeeWash ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # -----------------------------
      # Mirror Release to Public Repo
      # -----------------------------

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: gh auth status

      - name: Download APK from Private Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets

          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Mirror Release to Public Repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" \
            --repo Abdulaowalasif/ezze-wash-apk-release >/dev/null 2>&1
          then
            echo "Release already exists. Uploading APK..."

            gh release upload \
              "${{ github.ref_name }}" \
              release-assets/* \
              --repo Abdulaowalasif/ezze-wash-apk-release \
              --clobber

          else
            echo "Creating release in public repository..."

            gh release create \
              "${{ github.ref_name }}" \
              release-assets/* \
              --repo Abdulaowalasif/ezze-wash-apk-release \
              --title "EzeeWash ${{ github.ref_name }}" \
              --generate-notes
          fi