name: Build and Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Create .env from GitHub Secret
      - name: Create .env
        shell: bash
        run: |
          cat > .env <<EOF
          ${{ secrets.ENV_FILE }}
          EOF

      # Verify .env exists
      - name: Verify .env
        run: |
          if [ -f ".env" ]; then
            echo "✅ .env created successfully"
            echo "Lines in .env:"
            wc -l .env
          else
            echo "❌ .env not found!"
            exit 1
          fi

      # Install Flutter packages
      - name: Get Dependencies
        run: flutter pub get

      # Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # Verify APK exists
      - name: Verify APK
        run: |
          find build -name "*.apk"

      # Upload APK to GitHub Release
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EzeeWash ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
