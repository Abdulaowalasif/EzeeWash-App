name: ezeewash
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # --- Navigation ---
  go_router: ^14.2.0

  # --- Supabase ---
  supabase_flutter: ^2.5.6

  # --- Dependency Injection ---
  get_it: ^7.7.0

  # --- Network & Storage ---
  dio: ^5.4.3+1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # --- UI ---
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # --- Maps & Location ---
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

  # --- Utilities ---
  intl: ^0.19.0
  uuid: ^4.4.2
  dartz: ^0.10.1

  # --- Functional Programming ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  url_launcher: ^6.1.10
  google_sign_in: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/animation/
    - assets/service_picture/
    - assets/services/
    - assets/images/

flutter_icons:
  android: true
  image_path: "assets/logo/applogo.png"